services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: horasculo
      POSTGRES_USER: horasculo
      POSTGRES_PASSWORD: horasculo
    ports:
      - "5432:5432"
    volumes:
      - horasculo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horasculo -d horasculo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  horasculo-postgres:
